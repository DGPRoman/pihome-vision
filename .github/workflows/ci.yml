name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        # From the lockfile, with hashes, so what CI proves is a specific set of
        # transitive versions rather than whatever resolved that morning. --no-deps
        # on the package: its dependencies are pinned above, and without it pip is
        # free to re-resolve and undo the lock.
        run: |
          pip install --require-hashes --requirement requirements/dev.txt
          pip install -e . --no-deps

      - name: Format check
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check
        run: mypy

      - name: Ensure no secrets, weights or frames are tracked
        # A committed credential cannot be un-published, and neither can a picture of
        # somebody's house; model weights carry licences of their own. .gitignore
        # keeps them out today, and this is what notices the day it stops.
        run: |
          tracked=$(git ls-files -- '.env' '*.env' '*.onnx' 'models/*' '*.jpg' '*.jpeg')
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::secrets, model weights or camera frames are tracked by git"
            exit 1
          fi
          echo "Nothing that must stay local is in the index."

  deploy-files:
    name: Deployment files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint the install script
        # ruff and mypy cannot read shell, so this is the only thing standing between an
        # unquoted expansion and the machine it runs on as root.
        run: shellcheck --severity=style deploy/install.sh

      - name: Verify the unit with systemd-analyze
        # A misspelled directive is silently ignored by systemd, and reported here as a
        # warning that still exits 0, so the output, not the status, is the check. Stub
        # the ExecStart path first: an absent binary is the one complaint expected on a
        # runner, and stubbing it is cheaper than pattern-matching the message.
        run: |
          sudo install -d /opt/pihome-vision/.venv/bin
          sudo ln -sf /usr/bin/true /opt/pihome-vision/.venv/bin/pihome-vision

          output=$(systemd-analyze verify deploy/pihome-vision.service 2>&1)
          if [ -n "$output" ]; then
            echo "$output"
            echo "::error file=deploy/pihome-vision.service::systemd-analyze reported a problem"
            exit 1
          fi
          echo "Unit file is valid."

      - name: Keep the sandbox at least as tight as the hub's
        # The hub's unit scores 1.9. A threshold is in tenths, and anything above it
        # fails the step, so a sandbox option dropped without thought is noticed.
        run: systemd-analyze security --offline=yes --threshold=19 deploy/pihome-vision.service

  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check the lockfiles match pyproject.toml
        # The same script a developer runs, so the command line uv records at the top
        # of each file is the same too. Without --upgrade the existing pins are kept as
        # preferences, so this only moves when pyproject.toml has actually changed.
        run: |
          requirements/refresh.sh
          if ! git diff --exit-code -- requirements/; then
            echo "::error::requirements/ is out of date — run requirements/refresh.sh"
            exit 1
          fi
          echo "Lockfiles are current."

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor; 3.13 is Debian 13's and 3.14 the newest, where a
        # desktop is likely to be.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: |
          pip install --require-hashes --requirement requirements/dev.txt
          pip install -e . --no-deps

      - name: Install ffmpeg
        # For the one test that runs a real ffmpeg, to check which frames a rate
        # lets through; every other test plays a stand-in. One leg is enough.
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Test
        run: pytest

  test-gui:
    name: Test (GUI build of OpenCV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        # The build the drawing tools need. Every other leg has the headless one, and
        # the two are separate wheels with separate type stubs.
        run: |
          pip install --require-hashes --requirement requirements/dev-gui.txt
          pip install -e . --no-deps

      - name: Test
        run: pytest

      - name: Type check
        run: mypy

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install 'build==1.6.1'
          python -m build

      - name: Verify the wheel installs and runs
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --require-hashes --requirement requirements/headless.txt
          /tmp/verify/bin/pip install --no-deps dist/*.whl
          /tmp/verify/bin/pihome-vision --version
