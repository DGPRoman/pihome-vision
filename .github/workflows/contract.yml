name: Contract

# The hub client and the lights against a real hub. Pull requests run them against
# the hub commit pinned below, so that a red run here is about this repository's
# change; once a week they run against the hub's main, to notice the hub moving
# before the pin does.
#
# Move the pin when this project follows a change in the hub, in the same pull
# request as the change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

# Least privilege: nothing here needs to write to either repository.
permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

env:
  HUB_REF: b5791388347d38c5f9074625c06ad7324dc5eed9
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  contract:
    name: Contract (pihome-hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DGPRoman/pihome-hub
          ref: ${{ github.event_name == 'schedule' && 'main' || env.HUB_REF }}
          path: pihome-hub
          persist-credentials: false

      # 3.11 for the hub, the Python its own CI proves it on; 3.12, the last listed
      # and so the one called python, for this project.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: |
            3.11
            3.12
          cache: pip
          cache-dependency-path: |
            requirements/dev.txt
            pihome-hub/requirements/base.txt

      - name: Install
        run: |
          pip install --require-hashes --requirement requirements/dev.txt
          pip install -e . --no-deps

      - name: Lint the script
        run: shellcheck --severity=style scripts/contract-test.sh

      # Starts the hub on loopback with a throwaway key, runs the contract tests and
      # prints the hub's log if they fail.
      - name: Contract tests
        env:
          PIHOME_HUB_DIR: pihome-hub
          HUB_PYTHON: python3.11
          PYTHON: python
        run: scripts/contract-test.sh -ra
